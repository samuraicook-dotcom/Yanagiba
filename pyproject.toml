[project]
name = "yanagiba"
version = "0.1.0"
description = "Institutional-grade quantitative crypto trading agent"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
yanagiba = "yanagiba.main:main"

[tool.setuptools.packages.find]
include = ["yanagiba*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
